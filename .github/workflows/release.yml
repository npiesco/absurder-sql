name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, Linux, X64, absurder-sql, trusted]
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          case "$GITHUB_REF_NAME" in v*) ;; *) exit 1 ;; esac
          printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  qualify:
    needs: version
    uses: ./.github/workflows/qualify.yml
    with:
      release_version: ${{ needs.version.outputs.version }}

  publish-crates:
    needs: [version, qualify]
    runs-on: [self-hosted, Linux, X64, absurder-sql, trusted]
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qualified-packages
          path: ${{ runner.temp }}/qualified-crates
      - name: Verify and publish qualified crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/qualified-crates"
          python3 - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          name = "absurder-sql-" + os.environ["RELEASE_VERSION"] + ".crate"
          record = next(row for row in json.loads(Path("artifact-sha256.json").read_text()) if row["file"] == name)
          if hashlib.sha256(Path(name).read_bytes()).hexdigest() != record["sha256"]:
              raise SystemExit("Crate artifact hash mismatch")
          with tarfile.open(name) as archive:
              archive.extractall("source", filter="data")
          PY
          cargo publish --locked --no-verify \
            --manifest-path "source/absurder-sql-$RELEASE_VERSION/Cargo.toml"

  # npm trusted publishing does not support self-hosted GitHub Actions runners.
  # This job only publishes the exact VM-qualified archive; it never rebuilds.
  publish-npm:
    needs: [version, qualify, publish-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qualified-packages
          path: qualified
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish exact qualified npm archive using OIDC
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          npm install -g npm@latest
          cd qualified
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          name = "npiesco-absurder-sql-" + os.environ["RELEASE_VERSION"] + ".tgz"
          record = next(row for row in json.loads(Path("artifact-sha256.json").read_text()) if row["file"] == name)
          if hashlib.sha256(Path(name).read_bytes()).hexdigest() != record["sha256"]:
              raise SystemExit("npm artifact hash mismatch")
          PY
          npm publish "npiesco-absurder-sql-$RELEASE_VERSION.tgz" \
            --ignore-scripts --access public --provenance

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
